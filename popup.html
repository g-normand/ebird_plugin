<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body {
      font-family: Arial, sans-serif;
      font-size: 12px;
      width: 230px;
      padding: 10px 12px;
      margin: 0;
    }
    h3 { margin: 0 0 8px 0; font-size: 13px; }
    #status { margin-bottom: 8px; color: #333; }
    input[type="file"] { display: block; width: 100%; margin-bottom: 8px; font-size: 11px; }
    .row { display: flex; gap: 6px; }
    button { flex: 1; font-size: 11px; padding: 4px; cursor: pointer; }
  </style>
</head>
<body>
  <h3>eBird Category Tagger</h3>
  <div id="status">Loading…</div>
  <input type="file" id="csvFile" accept=".csv,text/csv" />
  <div class="row">
    <button id="clearBtn">Clear CSV</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
